{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flora do IFRN{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="nav-inner">
            <a href="{% url 'home' %}" class="brand">
                <span class="brand-tree">🌳</span>
                <span>
                    <strong>Flora do IFRN</strong>
                    <small>Campus Pau dos Ferros</small>
                </span>
            </a>

            <nav class="nav-links" aria-label="Navegação principal">
                <a href="{% url 'home' %}" class="active">Início</a>
                <a href="#">Mapa</a>
                <a href="#">Espécies</a>
                <a href="#">Curiosidades</a>
                <a href="#">Sobre</a>
            </nav>
        </div>
    </header>

    {% block content %}{% endblock %}
</body>
</html>
